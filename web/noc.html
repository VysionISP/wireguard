<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korvix NOC</title>
<style>
  :root {
    --bg: #05080b; --panel: #0b1017; --panel2: #0e151d; --border: #16222e;
    --text: #e8eef4; --muted: #6b7c8c; --dim: #8595a5;
    --accent: #21b8ad; --crit: #ff4d55; --warn: #ffb020; --ok: #33d17a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% -10%, #0a1420, var(--bg)) fixed;
    color: var(--text); font-family: var(--mono); overflow: hidden;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 20px; padding: 14px 26px;
    border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #0e151d, #0a0f16);
    flex: 0 0 auto;
  }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: .18em; }
  .brand span { color: var(--accent); }
  .brand .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); margin-right: 10px; vertical-align: middle; animation: beat 2s infinite; }
  @keyframes beat { 0%,100%{opacity:1} 50%{opacity:.35} }
  .fleet { display: flex; gap: 12px; margin-left: 8px; }
  .fleet .pill { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 7px 15px; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
  .fleet .pill b { font-size: 21px; color: var(--text); margin-right: 7px; font-variant-numeric: tabular-nums; }
  .fleet .pill.ok b { color: var(--ok); } .fleet .pill.bad b { color: var(--crit); } .fleet .pill.warn b { color: var(--warn); } .fleet .pill.maint b { color: var(--accent); }
  .maintbar { flex: 0 0 auto; text-align: center; font-size: 13px; letter-spacing: .08em; padding: 6px; background: #0a1620; color: var(--accent); border-bottom: 1px solid #14303a; }
  header .right { margin-left: auto; text-align: right; }
  #clock { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .conn { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .conn.live { color: var(--ok); } .conn.down { color: var(--crit); }
  .conn i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; }
  .soundbtn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 11px; font-size: 16px; cursor: pointer; }
  .soundbtn.off { opacity: .45; }
  .soundbtn.locked { border-color: var(--warn); color: var(--warn); animation: beat 1.6s infinite; }

  .fault.degraded { border-color: #4a3a10; }
  .fault.degraded .sevbar { background: var(--warn); box-shadow: 0 0 16px -2px var(--warn); }
  .fault.degraded .ftype { color: var(--warn); }

  .banner {
    flex: 0 0 auto; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: .22em;
    padding: 14px; text-transform: uppercase;
  }
  .banner.ok { background: linear-gradient(180deg, #0c2418, #0a1a12); color: var(--ok); border-bottom: 1px solid #14442c; }
  .banner.warn { background: linear-gradient(180deg, #2a2208, #1c1707); color: var(--warn); border-bottom: 1px solid #4a3a10; }
  .banner.crit { background: linear-gradient(180deg, #300d10, #220a0c); color: var(--crit); border-bottom: 1px solid #5a1a1e; animation: critpulse 1.4s infinite; }
  @keyframes critpulse { 0%,100%{ box-shadow: inset 0 0 40px -20px var(--crit); } 50%{ box-shadow: inset 0 0 70px -10px var(--crit); } }

  main { flex: 1 1 auto; display: grid; grid-template-columns: 1.9fr 1fr; gap: 0; min-height: 0; }
  section.faults { padding: 16px 20px; overflow-y: auto; min-height: 0; }
  aside.feed { border-left: 1px solid var(--border); background: #070b10; display: flex; flex-direction: column; min-height: 0; }
  h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 4px 0 12px; font-weight: 600; }
  h2 span { color: var(--dim); }

  .faultgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .fault { position: relative; display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .fault .sevbar { width: 6px; flex: 0 0 6px; }
  .fault.crit { border-color: #4a1a1e; } .fault.crit .sevbar { background: var(--crit); box-shadow: 0 0 16px -2px var(--crit); }
  .fault.warn { border-color: #4a3a10; } .fault.warn .sevbar { background: var(--warn); box-shadow: 0 0 16px -2px var(--warn); }
  .fmain { padding: 11px 14px; flex: 1; min-width: 0; }
  .ftop { display: flex; align-items: baseline; gap: 10px; }
  .who { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ftype { margin-left: auto; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: #0e1620; color: var(--dim); white-space: nowrap; }
  .fault.crit .ftype { color: var(--crit); } .fault.warn .ftype { color: var(--warn); }
  .fmsg { font-size: 14px; color: var(--text); margin: 6px 0 7px; line-height: 1.35; word-break: break-word; }
  .fmeta { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fmeta .serial { color: var(--dim); }
  .ackd { color: var(--accent); border: 1px solid #14343a; border-radius: 3px; padding: 0 5px; font-size: 10px; letter-spacing: .05em; }
  .fault.new { animation: flashin 1.6s ease-out; }
  @keyframes flashin { 0%{ transform: translateY(-6px) scale(1.015); box-shadow: 0 0 0 2px var(--accent); } 100%{ transform: none; box-shadow: none; } }

  .allclear { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 20px; }
  .allclear .big { font-size: 46px; color: var(--ok); letter-spacing: .12em; margin-bottom: 8px; }

  .feedlist { flex: 1; overflow-y: auto; padding: 4px 0 10px; }
  .fi { display: flex; align-items: baseline; gap: 9px; padding: 7px 18px; border-bottom: 1px solid #0d151d; font-size: 13px; }
  .fi.fresh { animation: feedin 1.2s ease-out; }
  @keyframes feedin { 0%{ background: #10202a; } 100%{ background: transparent; } }
  .fitime { color: var(--dim); font-size: 11.5px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .fidot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--muted); }
  .fimsg { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .fimsg b { color: var(--dim); font-weight: 600; }
  .t-login .fidot { background: var(--accent); } .t-login .fimsg { color: #bfe9e6; }
  .t-offline .fidot, .t-link-down .fidot, .t-monitor-error .fidot { background: var(--crit); }
  .t-online .fidot, .t-link-up .fidot { background: var(--ok); }
  .t-traffic-high .fidot, .t-traffic-low .fidot { background: var(--warn); }
  .t-backup .fidot { background: var(--dim); }

  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); flex-direction: column; gap: 14px; }
  #gate input { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 12px 16px; font: inherit; width: 340px; text-align: center; }
  #gate button { background: var(--accent); color: #04110f; border: none; border-radius: 6px; padding: 11px 22px; font: inherit; font-weight: 700; cursor: pointer; letter-spacing: .06em; }
  #gate .h { font-size: 20px; letter-spacing: .2em; } #gate .s { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>KORVIX <span>NOC</span></div>
  <div class="fleet">
    <div class="pill ok"><b id="fOnline">–</b>ONLINE</div>
    <div class="pill warn hidden" id="pillWarn"><b id="fWarn">0</b>DEGRADED</div>
    <div class="pill maint hidden" id="pillMaint"><b id="fMaint">0</b>MAINT</div>
    <div class="pill bad"><b id="fOffline">–</b>OFFLINE</div>
    <div class="pill"><b id="fTotal">–</b>DEVICES</div>
  </div>
  <div class="right">
    <div id="clock">--:--:--</div>
    <div id="conn" class="conn"><i></i>connecting…</div>
  </div>
  <button id="soundBtn" class="soundbtn" title="Toggle alert sound">🔊</button>
</header>

<div id="banner" class="banner ok">— — —</div>
<div id="maintbar" class="maintbar hidden"></div>

<main>
  <section class="faults">
    <h2>Active Faults <span id="faultCount"></span></h2>
    <div id="faults" class="faultgrid"></div>
  </section>
  <aside class="feed">
    <h2>Live Feed</h2>
    <div id="feed" class="feedlist"></div>
  </aside>
</main>

<div id="gate" class="hidden">
  <div class="h">KORVIX <span style="color:var(--accent)">NOC</span></div>
  <div class="s">Paste an admin or session token to open the wallboard</div>
  <input id="gateInput" type="password" placeholder="token" autocomplete="off">
  <button id="gateBtn">Open wallboard</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---- token: ?token=… (persisted + stripped) or localStorage ---- */
function getToken() {
  const u = new URL(location.href);
  const q = u.searchParams.get("token");
  if (q) {
    localStorage.setItem("mtprov.token", q);
    u.searchParams.delete("token");
    history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
    return q;
  }
  return localStorage.getItem("mtprov.token") || "";
}

/* ---- clock ---- */
setInterval(() => {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}, 1000);

/* ---- age formatting ---- */
function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function hhmmss(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

/* ---- alert sound (Web Audio; needs a user gesture to unlock) ---- */
let soundOn = true;
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
  if (audioCtx.state === "suspended") audioCtx.resume();
  updateSoundBtn();
}
function alarm() {
  if (!soundOn || !audioCtx || audioCtx.state !== "running") return;
  // Two-tone chirp, repeated twice.
  const t0 = audioCtx.currentTime;
  for (let k = 0; k < 2; k++) {
    const base = t0 + k * 0.32;
    for (const [f, dt] of [[880, 0], [660, 0.16]]) {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = "square"; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, base + dt);
      g.gain.exponentialRampToValueAtTime(0.25, base + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, base + dt + 0.15);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(base + dt); osc.stop(base + dt + 0.16);
    }
  }
}
function updateSoundBtn() {
  const b = $("soundBtn");
  const locked = soundOn && (!audioCtx || audioCtx.state !== "running");
  b.textContent = soundOn ? (locked ? "🔇!" : "🔊") : "🔈";
  b.classList.toggle("off", !soundOn);
  b.classList.toggle("locked", locked); // amber pulse = click to enable audio
  b.title = !soundOn ? "Alert sound off — click to enable"
    : locked ? "Click to enable alert sound (browser needs a click first)"
    : "Alert sound on";
}
$("soundBtn").addEventListener("click", () => { soundOn = !soundOn; if (soundOn) unlockAudio(); updateSoundBtn(); });
// Any click on the page unlocks audio (satisfies the browser gesture rule).
document.addEventListener("click", () => { if (soundOn) unlockAudio(); }, { once: false });

/* ---- render ---- */
let seenIssueIds = new Set();
let seenCritIds = new Set();
let seenDegraded = new Set();
let seenEventKeys = new Set();
let firstFrame = true;

function render(f) {
  // fleet + banner
  $("fOnline").textContent = f.fleet.online;
  $("fOffline").textContent = f.fleet.offline;
  $("fTotal").textContent = f.fleet.total;
  const warn = f.fleet.warning || 0;
  $("fWarn").textContent = warn;
  $("pillWarn").classList.toggle("hidden", warn === 0);
  const maint = f.maintenance || [];
  $("fMaint").textContent = maint.length;
  $("pillMaint").classList.toggle("hidden", maint.length === 0);
  const mb = $("maintbar");
  if (maint.length) {
    mb.classList.remove("hidden");
    mb.textContent = "🔧 MAINTENANCE — " + maint.map((m) => (m.scope || "fleet") + (m.note ? " (" + m.note + ")" : "")).join(" · ") + " — alerts suppressed";
  } else mb.classList.add("hidden");
  const c = f.counts || { critical: 0, warning: 0 };
  const banner = $("banner");
  if (c.critical > 0) { banner.className = "banner crit"; banner.textContent = `${c.critical} CRITICAL${c.warning ? " · " + c.warning + " WARNING" : ""}`; }
  else if (c.warning > 0) { banner.className = "banner warn"; banner.textContent = `${c.warning} WARNING`; }
  else { banner.className = "banner ok"; banner.textContent = "ALL SYSTEMS OPERATIONAL"; }

  // sound: beep when a NEW critical issue appears
  const critIds = f.issues.filter((i) => i.severity === "critical").map((i) => i.id);
  if (!firstFrame && soundOn) {
    const fresh = critIds.some((id) => !seenCritIds.has(id));
    if (fresh) alarm();
  }
  seenCritIds = new Set(critIds);

  // faults + degraded devices
  const box = $("faults");
  const degraded = f.degraded || [];
  $("faultCount").textContent = f.issues.length || degraded.length ? `(${f.issues.length + degraded.length})` : "";
  const issueCards = f.issues.map((i) => {
    const sev = i.severity === "critical" ? "crit" : "warn";
    const isNew = !firstFrame && !seenIssueIds.has(i.id);
    return `<div class="fault ${sev} ${isNew ? "new" : ""}">
      <div class="sevbar"></div>
      <div class="fmain">
        <div class="ftop"><span class="who">${esc(i.label || i.serialNumber)}</span><span class="ftype">${esc(i.type)}</span></div>
        <div class="fmsg">${esc(i.message)}</div>
        <div class="fmeta"><span class="serial">${esc(i.serialNumber)}</span>· opened ${esc(ago(i.openedAt))}${i.ackedBy ? ` · <span class="ackd">ack ${esc(i.ackedBy)}</span>` : ""}</div>
      </div></div>`;
  }).join("");
  const degCards = degraded.map((d) => {
    const isNew = !firstFrame && !seenDegraded.has(d.id);
    return `<div class="fault degraded ${isNew ? "new" : ""}">
      <div class="sevbar"></div>
      <div class="fmain">
        <div class="ftop"><span class="who">${esc(d.label || d.serialNumber)}</span><span class="ftype">degraded</span></div>
        <div class="fmsg">Not responding to pings${d.sinceSeconds != null ? ` — last reply ${Math.round(d.sinceSeconds)}s ago` : ""}</div>
        <div class="fmeta"><span class="serial">${esc(d.serialNumber)}</span>· approaching offline</div>
      </div></div>`;
  }).join("");
  if (!f.issues.length && !degraded.length) {
    box.innerHTML = `<div class="allclear"><div class="big">✓ ALL CLEAR</div>No active faults across ${f.fleet.total} device(s).</div>`;
  } else {
    box.innerHTML = issueCards + degCards;
  }
  seenIssueIds = new Set(f.issues.map((i) => i.id));
  seenDegraded = new Set(degraded.map((d) => d.id));

  // live feed
  const feed = $("feed");
  feed.innerHTML = (f.events || []).map((e) => {
    const key = e.at + "|" + e.serialNumber + "|" + e.message;
    const fresh = !firstFrame && !seenEventKeys.has(key);
    return `<div class="fi t-${esc(e.type)} ${fresh ? "fresh" : ""}">
      <span class="fitime">${esc(hhmmss(e.at))}</span><span class="fidot"></span>
      <span class="fimsg"><b>${esc(e.label || e.serialNumber)}:</b> ${esc(e.message)}</span></div>`;
  }).join("");
  seenEventKeys = new Set((f.events || []).map((e) => e.at + "|" + e.serialNumber + "|" + e.message));

  firstFrame = false;
}

/* ---- connection ---- */
let es = null, lastFrame = 0;
function setConn(state, text) { const el = $("conn"); el.className = "conn " + state; el.innerHTML = `<i></i>${text}`; }
function connect(token) {
  if (es) es.close();
  setConn("", "connecting…");
  es = new EventSource("/api/noc/stream?token=" + encodeURIComponent(token));
  es.onopen = () => setConn("live", "live");
  es.onmessage = (ev) => {
    let f; try { f = JSON.parse(ev.data); } catch { return; }
    if (f.type !== "noc") return;
    lastFrame = Date.now();
    setConn("live", "live");
    render(f);
  };
  es.onerror = () => setConn("down", "reconnecting…");
}
// Watchdog: a half-open socket (NAT/LB timeout on a long-lived wallboard) can
// look "open" so onerror never fires and the feed goes silently stale. If no
// frame has arrived for a while, force a genuine reconnect.
setInterval(() => {
  if (lastFrame && Date.now() - lastFrame > 15000) {
    setConn("down", "no data — reconnecting…");
    lastFrame = 0;
    const token = getToken();
    if (token) connect(token);
  }
}, 3000);

function start() {
  updateSoundBtn();
  const token = getToken();
  if (!token) { $("gate").classList.remove("hidden"); return; }
  $("gate").classList.add("hidden");
  connect(token);
}
$("gateBtn").addEventListener("click", () => {
  const t = $("gateInput").value.trim();
  if (!t) return;
  localStorage.setItem("mtprov.token", t);
  start();
});
$("gateInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("gateBtn").click(); });
start();
</script>
</body>
</html>
