<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Service status</title>
<style>
  :root {
    --bg: #05080b; --panel: #0b1017; --border: #16222e; --text: #e8eef4;
    --muted: #6b7c8c; --accent: #21b8ad; --ok: #33d17a; --warn: #ffb020; --crit: #ff4d55;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(120% 90% at 50% -10%, #0a1420, var(--bg)) fixed; color: var(--text); font-family: var(--mono); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 18px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .16em; }
  .brand span { color: var(--accent); }
  #cust { color: var(--muted); font-size: 14px; }
  .banner { border-radius: 8px; padding: 18px 22px; font-size: 19px; font-weight: 700; letter-spacing: .08em; margin-bottom: 18px; border: 1px solid var(--border); }
  .banner.operational { background: #0c2418; color: var(--ok); border-color: #14442c; }
  .banner.degraded { background: #2a2208; color: var(--warn); border-color: #4a3a10; }
  .banner.outage { background: #300d10; color: var(--crit); border-color: #5a1a1e; }
  .maint { background: #0a1620; border: 1px solid #14303a; color: var(--accent); border-radius: 6px; padding: 10px 16px; font-size: 13px; margin-bottom: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
  .panel h2 { margin: 0; padding: 12px 18px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid #0d151d; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .dot.up { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.degraded { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 1.2s infinite; }
  .dot.down { background: var(--crit); box-shadow: 0 0 8px var(--crit); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.subrow { padding-left: 44px; font-size: 13px; background: #080d13; }
  .row.subrow .dot { width: 7px; height: 7px; }
  .dot.unknown { background: #35424f; }
  .slachip { font-size: 10.5px; letter-spacing: .04em; border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
  .slachip.ok { color: var(--ok); border-color: #14442c; }
  .slachip.bad { color: var(--crit); border-color: #5a1a1e; }
  .row .state { color: var(--muted); font-size: 12.5px; }
  .up .state { color: var(--ok); } .stat-degraded { color: var(--warn); } .stat-down { color: var(--crit); }
  .mapbox { padding: 8px 10px 12px; }
  .mapbox svg { display: block; width: 100%; height: auto; }
  .mapbox .lnk { stroke: #22384a; stroke-width: 2; fill: none; }
  .mapbox .node rect { fill: #0e151d; stroke: var(--border); rx: 7; }
  .mapbox .node.up rect { stroke: #14442c; }
  .mapbox .node.degraded rect { stroke: #4a3a10; }
  .mapbox .node.down rect { stroke: #5a1a1e; }
  .mapbox text { font-family: var(--mono); fill: var(--text); }
  .mapbox .plbl { fill: var(--muted); font-size: 9px; }
  .uptime { display: flex; gap: 20px; padding: 16px 18px; align-items: baseline; }
  .uptime .big { font-size: 30px; font-weight: 700; }
  .uptime .k { color: var(--muted); font-size: 12px; }
  footer { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 8px; }
  #err { color: var(--crit); text-align: center; padding: 60px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">KORVIX <span>STATUS</span></div><div id="cust"></div></header>
  <div id="err" class="hidden">This status page is unavailable.</div>
  <div id="main" class="hidden">
    <div id="banner" class="banner operational">—</div>
    <div id="maint" class="maint hidden"></div>
    <div class="panel"><h2>Services</h2><div id="devices"></div></div>
    <div class="panel hidden" id="mapPanel"><h2>Network</h2><div class="mapbox"><svg id="map" viewBox="0 0 700 300" preserveAspectRatio="xMidYMid meet"></svg></div></div>
    <div class="panel hidden" id="incPanel"><h2>Current incidents</h2><div id="incidents"></div></div>
    <div class="panel"><h2>Last 30 days</h2><div class="uptime"><div class="big" id="uptime">—</div><div class="k">uptime, planned maintenance excluded</div></div></div>
    <footer id="updated"></footer>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = location.pathname.split("/").pop();
function since(iso) {
  const d = (Date.now() - Date.parse(iso)) / 1000;
  if (d < 3600) return Math.floor(d / 60) + "m";
  if (d < 86400) return Math.floor(d / 3600) + "h";
  return Math.floor(d / 86400) + "d";
}
const BANNER = { operational: "● ALL SYSTEMS OPERATIONAL", degraded: "● PARTIALLY DEGRADED", outage: "● SERVICE DISRUPTION" };
const INC = { offline: "Device offline", "link-down": "Link issue", "host-down": "Equipment offline", "traffic-high": "High utilisation", "traffic-low": "Low throughput", "monitor-error": "Monitoring issue" };
async function load() {
  let r;
  try {
    const res = await fetch("/api/status/" + encodeURIComponent(token));
    if (!res.ok) throw new Error();
    r = await res.json();
  } catch { $("err").classList.remove("hidden"); $("main").classList.add("hidden"); return; }
  $("err").classList.add("hidden"); $("main").classList.remove("hidden");
  $("cust").textContent = r.customer;
  document.title = r.customer + " — service status";
  const b = $("banner");
  b.className = "banner " + r.overall;
  b.textContent = BANNER[r.overall] || r.overall;
  const m = $("maint");
  if (r.maintenance && r.maintenance.length) {
    m.classList.remove("hidden");
    m.textContent = "🔧 Planned maintenance in progress" + (r.maintenance[0].note ? " — " + r.maintenance[0].note : "");
  } else m.classList.add("hidden");
  $("devices").innerHTML = (r.devices || []).map((d) => {
    const tgt = Number(d.slaTarget);
    const sla = d.slaTarget != null && !Number.isNaN(tgt)
      ? `<span class="slachip ${d.meetsSla ? "ok" : "bad"}" title="30-day uptime ${d.uptime30d.toFixed(2)}% vs ${tgt}% commitment">SLA ${tgt}% ${d.meetsSla ? "✓" : "✗ " + d.uptime30d.toFixed(2) + "%"}</span>`
      : "";
    const hostRows = (d.hosts || []).map((h) => `
      <div class="row subrow ${esc(h.state)}"><span class="dot ${esc(h.state)}"></span>
        <span class="name">${esc(h.label)}</span>
        <span class="state stat-${esc(h.state)}">${h.state === "unknown" ? "checking…" : h.state === "up" ? "operational" : esc(h.state)}</span></div>`).join("");
    return `
    <div class="row ${esc(d.state)}"><span class="dot ${esc(d.state)}"></span>
      <span class="name">${esc(d.label)}</span>${sla}
      <span class="state stat-${esc(d.state)}">${d.state === "up" ? (d.upSince ? "up · " + since(d.upSince) : "operational") : esc(d.state)}</span></div>${hostRows}`;
  }).join("")
    || '<div class="row"><span class="name" style="color:var(--muted)">No services listed.</span></div>';
  $("incPanel").classList.toggle("hidden", !(r.incidents || []).length);
  $("incidents").innerHTML = (r.incidents || []).map((i) => `
    <div class="row"><span class="dot down"></span><span class="name">${esc(i.label)}</span>
      <span class="state stat-down">${esc(INC[i.type] || i.type)} · ${since(i.since)}</span></div>`).join("");
  renderMap(r.map);
  $("uptime").textContent = r.uptime30d.toFixed(r.uptime30d >= 99.99 ? 3 : 2) + "%";
  $("uptime").style.color = r.uptime30d >= 99.9 ? "var(--ok)" : r.uptime30d >= 99 ? "var(--warn)" : "var(--crit)";
  $("updated").textContent = "Updated " + new Date(r.at).toLocaleTimeString() + " · refreshes automatically";
}
const DOTC = { up: "var(--ok)", degraded: "var(--warn)", down: "var(--crit)" };
/**
 * Draws the network as a TREE, not the dashboard's free-form layout — the
 * saved coordinates don't survive being squeezed into this narrow panel.
 * Root = the best-connected infrastructure device; everything else hangs off
 * it level by level (BFS over the links), port names on the branches.
 */
function renderMap(map) {
  const panel = $("mapPanel");
  if (!map || !map.nodes || map.nodes.length < 2) { panel.classList.add("hidden"); return; }
  panel.classList.remove("hidden");

  // Adjacency from links.
  const adj = new Map(map.nodes.map((n) => [n.key, []]));
  for (const l of map.links || []) {
    if (adj.has(l.a) && adj.has(l.b)) { adj.get(l.a).push(l.b); adj.get(l.b).push(l.a); }
  }
  // Roots first: infrastructure, then best-connected.
  const deg = (k) => adj.get(k).length;
  const seeds = [...map.nodes].sort((a, b) =>
    ((b.kind === "infrastructure") - (a.kind === "infrastructure")) || (deg(b.key) - deg(a.key)));
  // BFS layering across all components (isolated devices land on their own row).
  const level = new Map(), order = [];
  for (const s of seeds) {
    if (level.has(s.key)) continue;
    level.set(s.key, 0);
    const q = [s.key];
    while (q.length) {
      const k = q.shift();
      order.push(k);
      for (const nb of adj.get(k)) if (!level.has(nb)) { level.set(nb, level.get(k) + 1); q.push(nb); }
    }
  }
  const rows = [];
  for (const k of order) { const l = level.get(k); (rows[l] ??= []).push(k); }

  const W = 700, ROW = 88, PADY = 34;
  const H = PADY * 2 + (rows.length - 1) * ROW + 36;
  $("map").setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pos = new Map();
  rows.forEach((keys, l) => keys.forEach((k, i) =>
    pos.set(k, { x: (W * (i + 1)) / (keys.length + 1), y: PADY + l * ROW })));

  let svg = "";
  for (const l of map.links || []) {
    const a = pos.get(l.a), b = pos.get(l.b);
    if (!a || !b) continue;
    // Gentle curve so parallel branches don't overlap into one line.
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    svg += `<path class="lnk" fill="none" d="M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}"/>`;
    const lx = (t) => a.x + (b.x - a.x) * t, ly = (t) => a.y + (b.y - a.y) * t;
    if (l.aIface) svg += `<text class="plbl" x="${lx(0.3) + 5}" y="${ly(0.3)}" >${esc(l.aIface)}</text>`;
    if (l.bIface) svg += `<text class="plbl" x="${lx(0.7) + 5}" y="${ly(0.7)}">${esc(l.bIface)}</text>`;
  }
  const byKey = new Map(map.nodes.map((n) => [n.key, n]));
  for (const [k, p] of pos) {
    const n = byKey.get(k);
    const w = Math.max(90, (n.label || "").length * 7.5 + 34);
    svg += `<g class="node ${esc(n.state)}">
      <rect x="${p.x - w / 2}" y="${p.y - 17}" width="${w}" height="34" rx="7"/>
      <circle cx="${p.x - w / 2 + 15}" cy="${p.y}" r="4.5" fill="${DOTC[n.state] || "var(--muted)"}"/>
      <text x="${p.x - w / 2 + 27}" y="${p.y + 4}" font-size="12">${esc(n.label)}</text></g>`;
  }
  $("map").innerHTML = svg;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
