<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Service · Korvix</title>
<style>
  :root {
    --bg: #eef2f7; --card: #ffffff; --ink: #1f2a37; --muted: #64748b; --line: #e6ebf2;
    --brand: #2563eb; --brand-ink: #1d4ed8; --good: #16a34a; --good-bg: #eafaf0;
    --warn: #d97706; --warn-bg: #fef6e7; --bad: #dc2626; --bad-bg: #fdecec;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.45; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 64px; }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--brand); }
  .logo b { color: var(--ink); font-weight: 800; }
  .spacer { flex: 1; }
  .who { font-size: 14px; color: var(--muted); }
  button { font-family: inherit; font-size: 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 9px 15px; cursor: pointer; font-weight: 550; transition: .12s; }
  button:hover { border-color: #c7d2e0; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { background: var(--brand-ink); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.link { background: none; border: none; color: var(--brand); padding: 0; font-weight: 600; cursor: pointer; }

  /* big status hero */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 18px; display: flex; align-items: center; gap: 18px; }
  .hero .ic { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-size: 26px; }
  .hero.good .ic { background: var(--good-bg); color: var(--good); }
  .hero.warn .ic { background: var(--warn-bg); color: var(--warn); }
  .hero.bad .ic { background: var(--bad-bg); color: var(--bad); }
  .hero h1 { font-size: 21px; }
  .hero .sub { color: var(--muted); font-size: 14px; margin-top: 3px; }

  .notice { border-radius: 12px; padding: 13px 16px; font-size: 14px; margin-bottom: 16px; border: 1px solid; }
  .notice.info { background: #eef4ff; border-color: #d5e2fb; color: #1e40af; }

  .sectitle { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin: 22px 4px 10px; }

  /* service card */
  .svc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .svc-top { display: flex; align-items: center; gap: 13px; padding: 16px 18px; }
  .svc-ic { width: 40px; height: 40px; border-radius: 10px; background: #eef4ff; color: var(--brand); display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
  .svc-name { flex: 1; min-width: 0; }
  .svc-name .t { font-size: 16px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .svc-name .s { font-size: 13px; margin-top: 1px; }
  .pill { font-size: 12.5px; font-weight: 650; border-radius: 999px; padding: 4px 11px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill .d { width: 7px; height: 7px; border-radius: 50%; }
  .pill.good { background: var(--good-bg); color: var(--good); } .pill.good .d { background: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.warn .d { background: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.bad .d { background: var(--bad); }

  .svc-body { padding: 0 18px 16px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
  @media (min-width: 560px) { .facts { grid-template-columns: 1fr 1fr 1fr; } }
  .fact { background: #f7f9fc; border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
  .fact .v { font-size: 18px; font-weight: 700; }
  .fact .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fact .note { font-size: 12px; margin-top: 3px; font-weight: 600; }
  .fact .note.good { color: var(--good); } .fact .note.bad { color: var(--bad); }

  .equip { margin-top: 12px; }
  .equip .e { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: #f7f9fc; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; margin: 3px 5px 0 0; }
  .equip .d { width: 7px; height: 7px; border-radius: 50%; }
  .d.up { background: var(--good); } .d.degraded { background: var(--warn); } .d.down { background: var(--bad); } .d.unknown { background: #cbd5e1; }

  /* usage */
  .usage { margin-top: 14px; }
  .usage-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .usage-head .t { font-size: 14px; font-weight: 650; flex: 1; }
  .seg { display: inline-flex; background: #eef2f7; border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: transparent; padding: 5px 11px; font-size: 12.5px; border-radius: 7px; color: var(--muted); font-weight: 600; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .totals { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; }
  .tot .n { font-size: 17px; font-weight: 700; }
  .tot .l { font-size: 12px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 96px; padding: 4px 2px; border-bottom: 1px solid var(--line); }
  .bars .b { flex: 1; background: linear-gradient(180deg, #60a5fa, #2563eb); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .bars .b:hover { background: var(--brand-ink); }
  .bars .b .tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 6px; white-space: nowrap; margin-bottom: 5px; z-index: 5; }
  .bars .b:hover .tip { display: block; }
  .barx { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* support */
  .support { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; margin-top: 10px; }
  .support h3 { font-size: 15px; margin-bottom: 4px; }
  .support .line { display: flex; align-items: center; gap: 9px; font-size: 14px; margin-top: 9px; }
  .support .line .ic { width: 30px; height: 30px; border-radius: 8px; background: #eef4ff; color: var(--brand); display: grid; place-items: center; font-size: 15px; }
  .support a { color: var(--brand); font-weight: 600; text-decoration: none; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }

  /* login */
  #login { max-width: 380px; margin: 12vh auto 0; }
  .loginbox { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 26px; }
  #login .logo { font-size: 22px; text-align: center; margin-bottom: 4px; }
  #login .tag { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  #login label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin: 12px 0 5px; }
  #login input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: inherit; }
  #login input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px #dbe6fe; }
  #login button { width: 100%; margin-top: 18px; padding: 12px; font-size: 15px; }
  #loginErr { color: var(--bad); font-size: 13.5px; min-height: 18px; margin-top: 10px; text-align: center; }
  .hidden { display: none !important; }
  .skel { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <div class="logo"><b>Korvix</b></div>
    <div class="tag">Sign in to your service account</div>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" placeholder="you@example.com">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="primary" id="loginBtn">Sign in</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="wrap hidden">
  <div class="topbar">
    <div class="logo"><b>Korvix</b></div>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="ghost" id="logout">Sign out</button>
  </div>

  <div class="hero good" id="hero">
    <div class="ic" id="heroIc">✓</div>
    <div><h1 id="heroT">Checking your service…</h1><div class="sub" id="heroS"></div></div>
  </div>

  <div id="notices"></div>

  <div class="sectitle" id="svcTitle">Your services</div>
  <div id="services"></div>

  <div class="support" id="support"></div>

  <footer>This page is view-only and refreshes automatically. Times shown in your local timezone.</footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("korvix.portal.token") || "";
let timer = null;
const usage = {};   // id -> { days, data }
const RANGES = [{ d: 1, l: "24 hours" }, { d: 7, l: "7 days" }, { d: 30, l: "30 days" }];

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function bytes(n) { if (!n || n < 1) return "0 MB"; const u = ["bytes", "KB", "MB", "GB", "TB"]; const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024))); return (n / 1024 ** i).toFixed(i >= 2 ? 1 : 0) + " " + u[i]; }
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min";
  if (s < 172800) return Math.round(s / 3600) + " hours";
  return Math.round(s / 86400) + " days";
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: "Bearer " + token } });
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Something went wrong");
  return res.json();
}

function showLogin(msg) {
  clearInterval(timer);
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  if (msg) $("loginErr").textContent = msg;
}
async function doLogin() {
  const username = $("u").value.trim(), password = $("p").value;
  $("loginErr").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password }) });
    if (!r.ok) { $("loginErr").textContent = "That username or password wasn't right."; return; }
    const data = await r.json();
    if (data.role !== "customer") { $("loginErr").textContent = "Please use your customer account to sign in here."; return; }
    token = data.session; localStorage.setItem("korvix.portal.token", token);
    start();
  } catch (e) { $("loginErr").textContent = e.message; }
}

async function start() {
  try { await load(); } catch (e) { if (e.message !== "unauthorized") showLogin(e.message); return; }
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 30000);
}

async function load() {
  const d = await api("/api/portal/overview");
  $("who").textContent = "Hi, " + d.customer;
  // Friendly hero
  const hero = $("hero"), up = d.devices.filter((x) => x.state === "up").length;
  if (d.overall === "operational") {
    hero.className = "hero good"; $("heroIc").textContent = "✓";
    $("heroT").textContent = "Everything's working"; $("heroS").textContent = d.devices.length === 1 ? "Your service is online and running normally." : `All ${d.devices.length} of your connections are online.`;
  } else if (d.overall === "outage") {
    hero.className = "hero bad"; $("heroIc").textContent = "!";
    $("heroT").textContent = "Your service is offline"; $("heroS").textContent = "We can see the problem and our team is on it. No need to report it.";
  } else {
    hero.className = "hero warn"; $("heroIc").textContent = "!";
    $("heroT").textContent = "Minor issue detected"; $("heroS").textContent = `${up} of ${d.devices.length} connections online — we're keeping an eye on it.`;
  }
  // Plain-language notices
  const notices = [];
  for (const m of d.maintenance || []) notices.push(`<div class="notice info">🛠 Planned maintenance is underway${m.note ? ` (${esc(m.note)})` : ""}. Expected done by ${new Date(m.endsAt).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}.</div>`);
  $("notices").innerHTML = notices.join("");
  $("svcTitle").textContent = d.devices.length === 1 ? "Your service" : "Your services";
  renderServices(d.devices);
  renderSupport(d);
}

const STATE = { up: { c: "good", t: "Online" }, degraded: { c: "warn", t: "Unstable" }, down: { c: "bad", t: "Offline" } };
function renderServices(devices) {
  $("services").innerHTML = devices.map((dev) => {
    const st = STATE[dev.state] || { c: "warn", t: "Unknown" };
    const meets = dev.slaTarget == null ? "" : dev.meetsSla
      ? `<div class="note good">✓ Meeting your ${dev.slaTarget}% guarantee</div>`
      : `<div class="note bad">Below your ${dev.slaTarget}% guarantee</div>`;
    const equip = (dev.hosts || []).length
      ? `<div class="equip"><div class="muted" style="font-size:12.5px;margin-bottom:2px">Equipment on your network</div>${dev.hosts.map((h) => `<span class="e"><span class="d ${h.state}"></span>${esc(h.label)}</span>`).join("")}</div>`
      : "";
    return `<div class="svc" data-id="${esc(dev.id)}">
      <div class="svc-top">
        <div class="svc-ic">${dev.kind === "infrastructure" ? "📡" : "🌐"}</div>
        <div class="svc-name"><div class="t">${esc(dev.label)}</div>
          <div class="s muted">${dev.state === "up" ? (dev.upSince ? "Online for " + ago(dev.upSince) : "Online") : dev.state === "down" ? "Currently offline" : "Connection unstable"}</div></div>
        <span class="pill ${st.c}"><span class="d"></span>${st.t}</span>
      </div>
      <div class="svc-body">
        <div class="facts">
          <div class="fact"><div class="v">${dev.uptime30d.toFixed(2)}%</div><div class="k">Uptime this month</div>${meets}</div>
          <div class="fact"><div class="v" id="use-total-${esc(dev.id)}">—</div><div class="k">Data used (30 days)</div></div>
          <div class="fact"><div class="v">${dev.state === "up" ? "Good" : "—"}</div><div class="k">Connection</div></div>
        </div>
        ${equip}
        <div class="usage" id="usage-${esc(dev.id)}"><div class="skel">Loading your usage…</div></div>
      </div>
    </div>`;
  }).join("");
  for (const dev of devices) loadUsage(dev.id);
}

async function loadUsage(id) {
  const days = (usage[id] && usage[id].days) || 30;
  try {
    const t = await api("/api/portal/devices/" + encodeURIComponent(id) + "/traffic?hours=" + days * 24);
    usage[id] = { days, data: t };
    renderUsage(id);
  } catch (e) {
    const box = $("usage-" + id); if (box) box.innerHTML = `<div class="skel">Usage isn't available right now.</div>`;
  }
}
function setDays(id, d) { usage[id] = { ...(usage[id] || {}), days: d }; $("usage-" + id).innerHTML = '<div class="skel">Loading…</div>'; loadUsage(id); }
window.setDays = setDays;

function renderUsage(id) {
  const box = $("usage-" + id), st = usage[id]; if (!box || !st) return;
  const t = st.data;
  const iface = t.busiest || t.interfaces[0] || null;
  const tot = (iface && t.totals[iface]) || { rx: 0, tx: 0 };
  const totalEl = $("use-total-" + id); if (totalEl && st.days === 30) totalEl.textContent = bytes(tot.rx + tot.tx);
  const seg = RANGES.map((r) => `<button class="${r.d === st.days ? "on" : ""}" onclick="setDays('${id}',${r.d})">${r.l}</button>`).join("");
  const series = (iface && t.series[iface]) || [];
  const bars = bucketUsage(series, st.days);
  const max = Math.max(1, ...bars.map((b) => b.bytes));
  const barsHtml = bars.length
    ? bars.map((b) => `<div class="b" style="height:${Math.max(2, (b.bytes / max) * 100)}%"><span class="tip">${b.label}: ${bytes(b.bytes)}</span></div>`).join("")
    : "";
  box.innerHTML = `
    <div class="usage-head"><span class="t">Data usage</span><div class="seg">${seg}</div></div>
    <div class="totals">
      <div class="tot"><div class="n">${bytes(tot.rx)}</div><div class="l">⬇ Downloaded</div></div>
      <div class="tot"><div class="n">${bytes(tot.tx)}</div><div class="l">⬆ Uploaded</div></div>
      <div class="tot"><div class="n">${bytes(tot.rx + tot.tx)}</div><div class="l">Total</div></div>
    </div>
    ${bars.length ? `<div class="bars">${barsHtml}</div><div class="barx"><span>${bars[0].label}</span><span>${bars[bars.length - 1].label}</span></div>`
      : '<div class="skel">Your usage will show here as it builds up.</div>'}`;
}

// Turn cumulative counter samples into per-day (or per-hour) usage buckets.
function bucketUsage(series, days) {
  if (series.length < 2) return [];
  const hourly = days <= 1;
  const key = (at) => { const d = new Date(at); return hourly ? d.getHours() : d.getMonth() + "-" + d.getDate(); };
  const label = (at) => { const d = new Date(at); return hourly ? d.getHours() + ":00" : d.toLocaleDateString([], { month: "short", day: "numeric" }); };
  const buckets = new Map();
  const order = [];
  for (let i = 1; i < series.length; i++) {
    const a = series[i - 1], b = series[i];
    let delta = (b.rx - a.rx) + (b.tx - a.tx);
    if (delta < 0) delta = 0; // counter reset (reboot) — skip the dip
    const k = key(b.at);
    if (!buckets.has(k)) { buckets.set(k, { label: label(b.at), bytes: 0 }); order.push(k); }
    buckets.get(k).bytes += delta;
  }
  return order.map((k) => buckets.get(k));
}

function renderSupport(d) {
  const c = d.contact || {};
  const incidents = (d.incidents || []).filter((i) => i.type !== "login");
  const incHtml = incidents.length
    ? `<div class="line"><span class="ic">⚠️</span><span>We're currently working on ${incidents.length} issue${incidents.length > 1 ? "s" : ""} affecting your service.</span></div>`
    : `<div class="line"><span class="ic">✓</span><span>No known issues affecting your service right now.</span></div>`;
  $("support").innerHTML = `
    <h3>Need a hand?</h3>
    <div class="muted" style="font-size:13.5px">Our support team is here to help with anything to do with your service.</div>
    ${incHtml}
    ${c.phone ? `<div class="line"><span class="ic">📞</span><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>` : ""}
    ${c.contact ? `<div class="line"><span class="ic">👤</span><span>${esc(c.contact)}</span></div>` : ""}
    ${!c.phone && !c.contact ? '<div class="line"><span class="ic">✉️</span><span>Contact your provider using the details on your bill.</span></div>' : ""}`;
}

$("logout").addEventListener("click", async () => { await fetch("/api/logout", { method: "POST", headers: { authorization: "Bearer " + token } }).catch(() => {}); token = ""; localStorage.removeItem("korvix.portal.token"); showLogin(); });
$("loginBtn").addEventListener("click", doLogin);
$("p").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("u").addEventListener("keydown", (e) => { if (e.key === "Enter") $("p").focus(); });

if (token) start(); else showLogin();
</script>
</body>
</html>
