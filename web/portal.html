<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Korvix · Customer portal</title>
<style>
  :root {
    --bg: #05080b; --panel: #0b1017; --panel2: #0d141c; --border: #16222e; --border2: #22323f;
    --text: #e8eef4; --muted: #6b7c8c; --accent: #21b8ad; --green: #33d17a; --amber: #ffb020;
    --red: #ff4d55; --blue: #38bdf8; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(120% 90% at 50% -10%, #0a1420, var(--bg)) fixed; color: var(--text); font-family: var(--mono); min-height: 100vh; }
  a { color: var(--accent); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 34px 18px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .16em; }
  .brand span { color: var(--accent); }
  #cust { color: var(--muted); font-size: 14px; }
  .spacer { flex: 1; }
  button { font-family: inherit; font-size: 13px; background: #12202b; color: var(--text); border: 1px solid var(--border2); border-radius: 5px; padding: 8px 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #04110f; border-color: var(--accent); font-weight: 600; }
  .banner { border-radius: 8px; padding: 16px 20px; font-size: 18px; font-weight: 700; letter-spacing: .07em; margin-bottom: 16px; border: 1px solid var(--border); }
  .banner.operational { background: #0c2418; color: var(--green); border-color: #14442c; }
  .banner.degraded { background: #2a2208; color: var(--amber); border-color: #4a3a10; }
  .banner.outage { background: #300d10; color: var(--red); border-color: #5a1a1e; }
  .banner .sub { font-size: 12px; font-weight: 400; letter-spacing: .02em; color: var(--muted); margin-top: 3px; }
  .maint { background: #0a1620; border: 1px solid #14303a; color: var(--accent); border-radius: 6px; padding: 10px 16px; font-size: 13px; margin-bottom: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .panel h2 { margin: 0; padding: 12px 18px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; }
  .dev { border-bottom: 1px solid #0d151d; }
  .dev:last-child { border-bottom: none; }
  .devhead { display: flex; align-items: center; gap: 11px; padding: 13px 18px; cursor: pointer; }
  .devhead:hover { background: #0d141c; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .dot.up { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.degraded { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.2s infinite; }
  .dot.down { background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1.2s infinite; }
  .dot.unknown { background: #35424f; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .devhead .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .devhead .caret { color: var(--muted); font-size: 11px; transition: transform .12s; }
  .dev.open .caret { transform: rotate(90deg); }
  .chip { font-size: 10.5px; letter-spacing: .04em; border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; white-space: nowrap; color: var(--muted); }
  .chip.ok { color: var(--green); border-color: #14442c; }
  .chip.bad { color: var(--red); border-color: #5a1a1e; }
  .devbody { padding: 4px 18px 16px 38px; display: none; }
  .dev.open .devbody { display: block; }
  .sub { color: var(--accent); font-size: 10px; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .14em; }
  .subrow { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 13px; }
  .subrow .dot { width: 7px; height: 7px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 2px; }
  .stat .v { font-size: 16px; font-weight: 700; }
  .stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .prange { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .prange button { padding: 4px 9px; font-size: 11px; }
  .prange button.on { border-color: var(--accent); color: var(--accent); }
  .leg { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); margin-left: 6px; }
  .leg i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .pchart { background: #05080b; border: 1px solid var(--border2); border-radius: 5px; padding: 8px; margin-top: 4px; }
  .pchart svg { display: block; width: 100%; height: auto; }
  .chips { color: var(--muted); font-size: 12px; }
  .cmp { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; }
  .cmp .c { background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 7px 12px; }
  .cmp .big { font-size: 15px; font-weight: 700; }
  .cmp .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  /* login */
  #login { max-width: 340px; margin: 12vh auto 0; text-align: center; }
  #login input { width: 100%; background: var(--panel); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 12px 14px; font: inherit; margin: 7px 0; text-align: center; }
  #login button { width: 100%; margin-top: 8px; padding: 12px; }
  #loginErr { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .hidden { display: none !important; }
  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>

<div id="login">
  <div class="brand" style="margin-bottom:18px"><span>KORVIX</span> PORTAL</div>
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button class="primary" id="loginBtn">Sign in</button>
  <div id="loginErr"></div>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="brand"><span>KORVIX</span></div>
    <span id="cust"></span>
    <span class="spacer"></span>
    <span id="refreshed" class="chips"></span>
    <button id="logout">Sign out</button>
  </header>
  <div id="banner" class="banner operational"><div id="bmain">…</div><div class="sub" id="bsub"></div></div>
  <div id="maint"></div>
  <div class="panel"><h2>Your equipment</h2><div id="devices"></div></div>
  <footer>Read-only service portal · updates every 30s</footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("korvix.portal.token") || "";
let timer = null;
const RANGES = [{ h: 1, l: "1h" }, { h: 6, l: "6h" }, { h: 24, l: "24h" }, { h: 168, l: "7d" }, { h: 720, l: "30d" }];
const open = new Set();       // device ids expanded
const traffic = {};           // id -> { hours, data }

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtAge(iso) {
  if (!iso) return "—";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 90) return Math.round(s) + "s"; if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 129600) return Math.round(s / 3600) + "h"; return Math.round(s / 86400) + "d";
}
function fmtBytes(n) { if (!n) return "0 B"; const u = ["B", "KB", "MB", "GB", "TB"]; const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024))); return (n / 1024 ** i).toFixed(i ? 1 : 0) + " " + u[i]; }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), authorization: "Bearer " + token } });
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function showLogin(msg) {
  clearInterval(timer);
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  if (msg) $("loginErr").textContent = msg;
}
async function doLogin() {
  const username = $("u").value.trim(), password = $("p").value;
  $("loginErr").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password }) });
    if (!r.ok) { $("loginErr").textContent = "Invalid username or password"; return; }
    const data = await r.json();
    if (data.role !== "customer") { $("loginErr").textContent = "This portal is for customer accounts. Staff sign in at the main dashboard."; return; }
    token = data.session; localStorage.setItem("korvix.portal.token", token);
    start();
  } catch (e) { $("loginErr").textContent = e.message; }
}

async function start() {
  try { await load(); } catch (e) { if (e.message !== "unauthorized") showLogin(e.message); return; }
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 30000);
}

async function load() {
  const d = await api("/api/portal/overview");
  $("cust").textContent = d.customer;
  $("refreshed").textContent = "updated " + new Date().toLocaleTimeString();
  const upCount = d.devices.filter((x) => x.state === "up").length;
  $("banner").className = "banner " + d.overall;
  $("bmain").textContent = d.overall === "operational" ? "ALL SERVICES OPERATIONAL" : d.overall === "outage" ? "SERVICE OUTAGE" : "DEGRADED SERVICE";
  $("bsub").textContent = `${upCount}/${d.devices.length} device(s) online${d.incidents.length ? ` · ${d.incidents.length} active issue(s)` : ""}`;
  $("maint").innerHTML = (d.maintenance || []).map((m) => `<div class="maint">🛠 Planned maintenance: ${esc(m.note || "in progress")} — until ${new Date(m.endsAt).toLocaleString()}</div>`).join("");
  renderDevices(d.devices);
}

function slaChip(dev) {
  if (dev.slaTarget == null) return "";
  const cls = dev.meetsSla ? "ok" : "bad";
  return `<span class="chip ${cls}">${dev.uptime30d.toFixed(2)}% / ${dev.slaTarget}% SLA</span>`;
}
function renderDevices(devices) {
  $("devices").innerHTML = devices.map((dev) => {
    const isOpen = open.has(dev.id);
    const hosts = (dev.hosts || []).map((h) => `<div class="subrow"><span class="dot ${h.state}"></span> ${esc(h.label)} <span class="chips">${h.state}</span></div>`).join("");
    return `<div class="dev ${isOpen ? "open" : ""}" data-id="${esc(dev.id)}">
      <div class="devhead" data-toggle="${esc(dev.id)}">
        <span class="dot ${dev.state}"></span>
        <span class="name">${esc(dev.label)}</span>
        ${slaChip(dev)}
        <span class="chip">${dev.state === "up" ? "online" + (dev.upSince ? " · " + fmtAge(dev.upSince) : "") : dev.state}</span>
        <span class="caret">▶</span>
      </div>
      <div class="devbody">
        <div class="stats">
          <div class="stat"><div class="v">${dev.uptime30d.toFixed(2)}%</div><div class="k">30-day uptime</div></div>
          ${dev.slaTarget != null ? `<div class="stat"><div class="v" style="color:${dev.meetsSla ? "var(--green)" : "var(--red)"}">${dev.meetsSla ? "Meeting" : "Below"}</div><div class="k">SLA (${dev.slaTarget}%)</div></div>` : ""}
          <div class="stat"><div class="v">${dev.state === "up" ? "Online" : dev.state}</div><div class="k">status</div></div>
        </div>
        ${hosts ? `<div class="sub">Connected equipment</div>${hosts}` : ""}
        <div class="sub">Traffic</div>
        <div class="traffic" id="tr-${esc(dev.id)}">${isOpen ? '<span class="chips">loading…</span>' : ""}</div>
      </div>
    </div>`;
  }).join("");
  for (const id of open) loadTraffic(id);
}

async function loadTraffic(id) {
  const box = $("tr-" + id);
  if (!box) return;
  const hours = (traffic[id] && traffic[id].hours) || 24;
  try {
    const t = await api("/api/portal/devices/" + encodeURIComponent(id) + "/traffic?hours=" + hours);
    traffic[id] = { hours, data: t, iface: (traffic[id] && traffic[id].iface) || t.busiest || t.interfaces[0] || null };
    renderTraffic(id);
  } catch (e) { box.innerHTML = `<span class="chips">Traffic unavailable: ${esc(e.message)}</span>`; }
}
function setRange(id, h) { traffic[id] = { ...(traffic[id] || {}), hours: h }; loadTraffic(id); }
function setIface(id, n) { traffic[id].iface = n; renderTraffic(id); }
window.setRange = setRange; window.setIface = setIface;

function renderTraffic(id) {
  const box = $("tr-" + id); const st = traffic[id]; if (!box || !st) return;
  const t = st.data;
  const ranges = RANGES.map((r) => `<button class="${r.h === st.hours ? "on" : ""}" onclick="setRange('${id}',${r.h})">${r.l}</button>`).join("");
  if (!t.interfaces.length) { box.innerHTML = `<div class="prange">${ranges}</div><span class="chips">No traffic history yet for this window.</span>`; return; }
  const iface = st.iface && t.interfaces.includes(st.iface) ? st.iface : t.interfaces[0];
  const ifaceSel = `<select onchange="setIface('${id}',this.value)" style="background:#05080b;border:1px solid var(--border2);color:var(--text);border-radius:4px;padding:3px 6px;font:inherit;font-size:11px">${t.interfaces.map((n) => `<option ${n === iface ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
  const tot = t.totals[iface] || { rx: 0, tx: 0 }, prev = t.prevTotals[iface] || { rx: 0, tx: 0 };
  box.innerHTML = `
    <div class="prange">${ranges} <span class="chips">interface</span> ${ifaceSel}
      <span class="leg"><i style="background:var(--green)"></i>download</span>
      <span class="leg"><i style="background:var(--blue)"></i>upload</span></div>
    <div class="cmp">
      ${cmpTile("Downloaded", tot.rx, prev.rx)}
      ${cmpTile("Uploaded", tot.tx, prev.tx)}
      ${cmpTile("Total", tot.rx + tot.tx, prev.rx + prev.tx)}
    </div>
    <div class="pchart">${chartSVG(t.series[iface] || [], t.prevSeries ? (t.prevSeries[iface] || []) : [], t)}</div>
    <div class="chips" style="margin-top:4px">${t.samples} sample(s) · vs the preceding period.</div>`;
}
function cmpTile(label, cur, prev) {
  let delta = "";
  if (prev > 0) { const pct = ((cur - prev) / prev) * 100; delta = ` <span style="color:${pct >= 0 ? "var(--green)" : "var(--amber)"};font-size:11px">${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(0)}%</span>`; }
  return `<div class="c"><div class="big">${fmtBytes(cur)}${delta}</div><div class="lbl">${label}</div></div>`;
}
function chartSVG(cur, prev, t) {
  const W = 820, H = 150, P = 6;
  const rate = (arr) => { const o = []; for (let i = 1; i < arr.length; i++) { const dt = (arr[i].at - arr[i - 1].at) / 1000; if (dt > 0) o.push({ at: arr[i].at, v: Math.max(0, ((arr[i].rx - arr[i - 1].rx) + (arr[i].tx - arr[i - 1].tx)) * 8 / dt) }); } return o; };
  const c = rate(cur), p = rate(prev);
  if (!c.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="#6b7c8c" font-size="12" font-family="monospace">accumulating…</text></svg>`;
  const max = Math.max(1, ...c.map((x) => x.v), ...p.map((x) => x.v));
  const t0 = c[0].at, t1 = c[c.length - 1].at || t0 + 1;
  const X = (at) => P + ((at - t0) / (t1 - t0)) * (W - 2 * P);
  const Y = (v) => H - P - (v / max) * (H - 2 * P);
  const line = (arr, color, w, op) => arr.length ? `<polyline fill="none" stroke="${color}" stroke-width="${w}" opacity="${op}" points="${arr.map((x) => `${X(x.at).toFixed(1)},${Y(x.v).toFixed(1)}`).join(" ")}"/>` : "";
  // download area (green) + upload split isn't separated here; show combined throughput vs previous.
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${line(p, "#3a4a5a", 1, .8)}
    ${line(c, "var(--green)", 1.6, 1)}
  </svg>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle]");
  if (t) {
    const id = t.dataset.toggle;
    if (open.has(id)) open.delete(id); else { open.add(id); if (!traffic[id]) loadTraffic(id); }
    document.querySelector(`.dev[data-id="${CSS.escape(id)}"]`)?.classList.toggle("open");
    if (open.has(id)) { const b = $("tr-" + id); if (b && !b.childElementCount) loadTraffic(id); }
  }
});
$("logout").addEventListener("click", async () => { await fetch("/api/logout", { method: "POST", headers: { authorization: "Bearer " + token } }).catch(() => {}); token = ""; localStorage.removeItem("korvix.portal.token"); showLogin(); });
$("loginBtn").addEventListener("click", doLogin);
$("p").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("u").addEventListener("keydown", (e) => { if (e.key === "Enter") $("p").focus(); });

if (token) start(); else showLogin();
</script>
</body>
</html>
